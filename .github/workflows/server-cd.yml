name: server-cd

# main 에서 server-ci(테스트)가 성공하면 이미지를 굽고 EC2 에 배포한다.
# 수동 배포: Actions → server-cd → Run workflow (main 기준)
#
# 필요한 설정 (Settings → Secrets and variables → Actions, 또는 production 환경)
#   Secrets : DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, EC2_HOST, EC2_USER, EC2_SSH_KEY
# 계정명이 secret 이라 job 간에는 태그만 넘기고 이미지 이름은 각 job 에서 조립한다
# (GitHub 은 secret 이 섞인 job output 을 버린다)
# 자세한 내용: docs/deploy.md
on:
  workflow_run:
    workflows: [server-ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-cd
  cancel-in-progress: false   # 배포 도중 끊지 않는다

env:
  IMAGE_NAME: drive-rule-server

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # CI 가 검증한 바로 그 커밋을 배포한다
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        working-directory: server
        run: ./gradlew bootJar --no-daemon

      - name: Image tag
        id: meta
        run: |
          echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          sparse-checkout: server/deploy

      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deploy files
        run: |
          ssh -i ~/.ssh/ec2 "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'mkdir -p ~/drive-rule'
          scp -i ~/.ssh/ec2 server/deploy/compose.prod.yaml server/deploy/dc.sh \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/drive-rule/"
          ssh -i ~/.ssh/ec2 "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'chmod +x ~/drive-rule/dc.sh'

      # 비공개 이미지도 받을 수 있게 EC2 에서 Docker Hub 에 로그인 (토큰은 stdin 으로만 전달)
      - name: Docker Hub login on EC2
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DH_TOKEN" | ssh -i ~/.ssh/ec2 "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "docker login -u '$DH_USER' --password-stdin"

      - name: Deploy
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.tag }}
        run: |
          ssh -i ~/.ssh/ec2 "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" IMAGE="$IMAGE" bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/drive-rule
          test -f .env || { echo "~/drive-rule/.env 가 없다 (docs/deploy.md 참고)"; exit 1; }
          # 수동 조작(./dc.sh)이 같은 이미지를 쓰도록 배포 태그를 기록
          printf '%s\n' "$IMAGE" > .image
          ./dc.sh pull app
          ./dc.sh up -d
          PORT=$(grep -E '^APP_PORT=' .env | cut -d= -f2 || true); PORT=${PORT:-8080}
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${PORT}/actuator/health" | grep -q '"status":"UP"'; then
              echo "배포 완료: $IMAGE"
              docker image prune -f >/dev/null
              exit 0
            fi
            sleep 5
          done
          echo "헬스체크 실패 — 최근 로그:"
          ./dc.sh logs --tail 100 app
          exit 1
          REMOTE
