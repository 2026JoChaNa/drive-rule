spring:
  application:
    name: drive-rule-server
  # 로컬: compose.yaml의 MySQL 연결 정보를 docker-compose 지원이 자동 주입한다.
  # 서버: 환경변수 DB_URL, DB_USERNAME, DB_PASSWORD로 지정한다.
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 테이블은 Flyway가 만들고, Hibernate는 엔티티와 맞는지만 검사한다
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    locations: classpath:db/migration

# API 문서 (springdoc)
#   Swagger UI : /swagger-ui.html
#   JSON       : /v3/api-docs        (YAML: /v3/api-docs.yaml)
# 배포 환경에서 끄려면 API_DOCS_ENABLED=false
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
