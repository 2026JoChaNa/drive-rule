spring:
  application:
    name: drive-rule-server
  # 로컬: compose.yaml의 MySQL 연결 정보를 docker-compose 지원이 자동 주입한다.
  # 서버: 환경변수 DB_URL, DB_USERNAME, DB_PASSWORD로 지정한다.
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 테이블은 Flyway가 만들고, Hibernate는 엔티티와 맞는지만 검사한다
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    locations: classpath:db/migration

# API 문서 (springdoc)
#   Swagger UI : /swagger-ui.html
#   JSON       : /v3/api-docs        (YAML: /v3/api-docs.yaml)
# 배포 환경에서 끄려면 API_DOCS_ENABLED=false
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html

# 응답 압축 — 보호구역 좌표 파일(약 31만 바이트 → 약 8만 바이트, 결정 010). 해시는 압축 전 바이트 기준
server:
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 2KB

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 검수 CMS API(/api/v1/admin/**) 키 — 요청 헤더 X-Admin-Key 와 비교한다.
# 비어 있으면 관리자 API 전체가 401 이다 (앱용 API 는 영향 없음).
driverule:
  admin:
    api-key: ${ADMIN_API_KEY:}

# 법령 개정 자동 수집 (결정 011) — 국가법령정보 공동활용 Open API.
# LAW_API_OC 가 비어 있으면 수집하지 않는다 (POST /api/v1/admin/law-revisions/sync 는 503).
# Open API 신청 때 이 서버의 IP 를 등록해야 응답이 온다.
  law-sync:
    oc: ${LAW_API_OC:}
    law-ids: ${LAW_SYNC_LAW_IDS:001638,003395,007079}   # 도로교통법 · 시행령 · 시행규칙
    cron: ${LAW_SYNC_CRON:0 30 6 * * *}
    lookback-days: ${LAW_SYNC_LOOKBACK_DAYS:90}
    since: ${LAW_SYNC_SINCE:2026-10-01}
